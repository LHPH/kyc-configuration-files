<VirtualHost *:443>

    ServerName www.kyc-project.com
    #ServerPath "/gateway"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/www.kyc-project.com.crt
    SSLCertificateKeyFile /etc/ssl/private/www.kyc-project.com.key

    <Proxy "balancer://mycluster">
        BalancerMember "http://localhost:10000/gateway"
        BalancerMember "http://localhost:10001/gateway"
        Order deny,allow
        Allow from all
        ProxySet lbmethod=bytraffic
    </Proxy>

    <Location /gateway>
        ProxyPreserveHost On
        ProxyPass "balancer://mycluster"
        ProxyPassReverse "balancer://mycluster"
    </Location>

</VirtualHost>